# Bouwt en test de site bij elke push en pull request. Op main bewaart de build dist/ voor de
# uitrol (job deploy). Zie docs/superpowers/specs/2026-11-21-website-design.md, Bouwen en uitrollen.
name: Site

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Alleen tonen wat er zou veranderen op mijn.host (lftp mirror --dry-run)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Types en inhoud controleren
        run: npm run check

      - run: npm run build

      - run: npm test

      - name: dist/ bewaren voor de uitrol
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          include-hidden-files: true # .htaccess en _astro/.htaccess
          if-no-files-found: error
          retention-days: 7

  # Zet dist/ op mijn.host. Op een push naar main alleen als de repo-variabele DEPLOY_ENABLED
  # 'true' is; handmatig starten kan altijd (vanaf main), ook als proefrun (dry_run).
  deploy:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    environment: mijn-host
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: lftp installeren
        run: sudo apt-get update && sudo apt-get install -y lftp

      # Ronde 1 zet de nieuwe bestanden in _astro/ klaar (nieuwe namen, dus geen botsing).
      # Ronde 2 zet de rest neer en verwijdert wat niet meer in dist/ staat, behalve _astro/,
      # .well-known/ (het certificaat) en cgi-bin/ (DirectAdmin). Ronde 3 ruimt pas daarna de
      # oude bestanden in _astro/ op, als de HTML al naar de nieuwe verwijst. Het wachtwoord
      # gaat via LFTP_PASSWORD, dus niet in het script en niet op de opdrachtregel.
      - name: Uploaden via FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          cat > "$RUNNER_TEMP/connect.lftp" <<EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 2
          open --env-password -u "$FTP_USERNAME" "ftp://$FTP_SERVER"
          EOF

          # Ronde 2 en 3 verwijderen bestanden in de FTP-root. Dat is alleen veilig als het account
          # op public_html is vastgezet. Staat er een map van het hele hostingaccount in de root,
          # dan stoppen we vóór er iets wordt geüpload of verwijderd (ook bij een proefrun).
          cat > "$RUNNER_TEMP/list.lftp" <<EOF
          source "$RUNNER_TEMP/connect.lftp"
          cls -1a /
          EOF
          lftp -f "$RUNNER_TEMP/list.lftp" > "$RUNNER_TEMP/root-listing.txt"
          if sed 's#/*$##; s#.*/##' "$RUNNER_TEMP/root-listing.txt" | grep -Exq 'domains|public_html|private_html|mail|.ssh'; then
            echo "::error::De FTP-root lijkt het hele hostingaccount te zijn, niet public_html. Uploaden gestopt."
            exit 1
          fi

          cat > "$RUNNER_TEMP/upload.lftp" <<EOF
          source "$RUNNER_TEMP/connect.lftp"
          mirror --reverse --verbose $DRY_RUN dist/_astro /_astro
          mirror --reverse --delete --verbose $DRY_RUN --exclude-glob _astro/ --exclude-glob .well-known/ --exclude-glob cgi-bin/ dist/ /
          mirror --reverse --delete --verbose $DRY_RUN dist/_astro /_astro
          EOF
          lftp -f "$RUNNER_TEMP/upload.lftp"

      - name: Rooktest
        if: ${{ !inputs.dry_run }}
        run: |
          code=$(curl -sS --max-time 30 -o "$RUNNER_TEMP/home.html" -w '%{http_code}' https://mvesign.com/)
          if [ "$code" != "200" ] || ! grep -q '<title>' "$RUNNER_TEMP/home.html"; then
            echo "::error::De home geeft status '$code' of heeft geen <title>"
            exit 1
          fi
          result=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code} %{redirect_url}' https://mvesign.com/article/sonarqube-serialization-pattern)
          if [ "$result" != "301 https://mvesign.com/notes/sonarqube-serialization-pattern/" ]; then
            echo "::error::De redirect van /article/ geeft '$result'"
            exit 1
          fi
