# Bouwt en test de site bij elke push en pull request. Op main bewaart de build dist/ voor de
# uitrol (job deploy). Zie docs/superpowers/specs/2026-11-21-website-design.md, Bouwen en uitrollen.
name: Site

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Alleen tonen wat er zou veranderen op mijn.host (lftp mirror --dry-run)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Types en inhoud controleren
        run: npm run check

      - run: npm run build

      - run: npm test

      - name: dist/ bewaren voor de uitrol
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          include-hidden-files: true # .htaccess en _astro/.htaccess
          if-no-files-found: error
          retention-days: 7

  # Zet dist/ op mijn.host. Op een push naar main alleen als de repo-variabele DEPLOY_ENABLED
  # 'true' is; handmatig starten kan altijd (vanaf main), ook als proefrun (dry_run).
  deploy:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    environment: mijn-host
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: lftp installeren
        run: sudo apt-get update && sudo apt-get install -y lftp

      # SFTP (poort 22) met het FTP-account, dat alleen bij public_html kan. De sleutel van de
      # server staat hieronder vast: wijzigt die, dan stopt ssh en gaat er niets live. Controleer
      # een nieuwe sleutel bij mijn.host voordat je hem hier vervangt (ssh-keyscan -t rsa h30.mijn.host).
      # FTPS werkt niet: de FTP-server van mijn.host stuurt zijn certificaat zonder tussencertificaat.
      #
      # Ronde 1 zet de nieuwe bestanden in _astro/ klaar (nieuwe namen, dus geen botsing).
      # Ronde 2 zet de rest neer en verwijdert wat niet meer in dist/ staat, behalve _astro/,
      # .well-known/ (het certificaat) en cgi-bin/ (DirectAdmin). Ronde 3 ruimt pas daarna de
      # oude bestanden in _astro/ op, als de HTML al naar de nieuwe verwijst.
      # De twee .htaccess-bestanden doen niet mee in die rondes: mirror verwijdert een bestand
      # met een nieuwere tijd eerst en zet het dan opnieuw neer, en de build geeft elk bestand
      # een nieuwe tijd. Dan staat de site bij elke uitrol even zonder regels, en LiteSpeed past
      # een nieuwe .htaccess soms pas later toe. Ronde 4 vervangt een .htaccess daarom alleen als
      # de inhoud verschilt van wat er staat (of als hij ontbreekt). Het wachtwoord
      # gaat via LFTP_PASSWORD, dus niet in het script en niet op de opdrachtregel. Alle paden
      # zijn relatief aan de map waar het account na het inloggen staat.
      - name: Uploaden via SFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          cat > "$RUNNER_TEMP/known_hosts" <<'EOF'
          h30.mijn.host ssh-rsa 
          EOF

          cat > "$RUNNER_TEMP/connect.lftp" <<EOF
          set cmd:fail-exit true
          set net:max-retries 2
          set net:timeout 30
          set sftp:auto-confirm no
          set sftp:connect-program "ssh -a -x -o HostKeyAlias=h30.mijn.host -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1"
          open --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER"
          EOF

          # Ronde 2 en 3 verwijderen bestanden. Dat is alleen veilig als het account op
          # public_html staat. We stoppen vóór er iets wordt geüpload of verwijderd (ook bij een
          # proefrun) als:
          #  1. er een map van het hele hostingaccount staat (domains, public_html, ...), of
          #  2. er geen index.html staat. Die staat in de oude site, in een verse public_html en
          #     in deze site, dus een map zonder index.html is niet de websitemap.
          cat > "$RUNNER_TEMP/list.lftp" <<EOF
          source "$RUNNER_TEMP/connect.lftp"
          cls -1a .
          EOF
          lftp -f "$RUNNER_TEMP/list.lftp" > "$RUNNER_TEMP/root-listing.txt"
          sed 's#/*$##; s#.*/##' "$RUNNER_TEMP/root-listing.txt" > "$RUNNER_TEMP/root-names.txt"
          if grep -Exq 'domains|public_html|private_html|mail|\.ssh' "$RUNNER_TEMP/root-names.txt"; then
            echo "::error::De map van het account lijkt het hele hostingaccount te zijn, niet public_html. Uploaden gestopt."
            exit 1
          fi
          if ! grep -Fxq index.html "$RUNNER_TEMP/root-names.txt"; then
            echo "::error::De map van het account bevat geen index.html en lijkt dus niet de websitemap public_html. Uploaden gestopt."
            exit 1
          fi

          # --exclude '^[.]htaccess$' slaat alleen de .htaccess in de bovenste map van een ronde
          # over; mirror vervangt en verwijdert die dan niet.
          cat > "$RUNNER_TEMP/upload.lftp" <<EOF
          source "$RUNNER_TEMP/connect.lftp"
          mirror --reverse --no-perms --verbose $DRY_RUN --exclude '^[.]htaccess$' dist/_astro _astro
          mirror --reverse --no-perms --delete --verbose $DRY_RUN --exclude '^[.]htaccess$' --exclude-glob _astro/ --exclude-glob .well-known/ --exclude-glob cgi-bin/ dist/ .
          mirror --reverse --no-perms --delete --verbose $DRY_RUN --exclude '^[.]htaccess$' dist/_astro _astro
          EOF
          lftp -f "$RUNNER_TEMP/upload.lftp"

          # Ronde 4: haal de .htaccess op die er staat, en vervang hem alleen als de inhoud
          # verschilt. Lukt het ophalen niet (bijv. omdat hij ontbreekt), dan zet put hem neer;
          # is de verbinding weg, dan faalt put, en daarmee de uitrol.
          sync_htaccess() {
            local path=$1 live="$RUNNER_TEMP/live.htaccess"
            rm -f "$live"
            printf 'source "%s"\nget %s -o "%s"\n' "$RUNNER_TEMP/connect.lftp" "$path" "$live" > "$RUNNER_TEMP/get.lftp"
            lftp -f "$RUNNER_TEMP/get.lftp" > /dev/null 2>&1 || true
            if [ -f "$live" ] && cmp -s "dist/$path" "$live"; then
              echo "$path: ongewijzigd, blijft staan"
            elif [ -n "$DRY_RUN" ]; then
              echo "$path: zou worden vervangen (proefrun)"
            else
              printf 'source "%s"\nset xfer:clobber on\nput "dist/%s" -o %s\n' "$RUNNER_TEMP/connect.lftp" "$path" "$path" > "$RUNNER_TEMP/put.lftp"
              lftp -f "$RUNNER_TEMP/put.lftp"
              echo "$path: vervangen"
            fi
          }
          sync_htaccess _astro/.htaccess
          sync_htaccess .htaccess

      # LiteSpeed past een nieuwe .htaccess soms pas na enige tijd toe. De rooktest probeert het
      # daarom tot twee minuten lang (12 pogingen, om de 10 seconden) en faalt pas daarna.
      - name: Rooktest
        if: ${{ !inputs.dry_run }}
        run: |
          expected="301 https://mvesign.com/notes/sonarqube-serialization-pattern/"
          for attempt in $(seq 1 12); do
            code=$(curl -sS --max-time 30 -o "$RUNNER_TEMP/home.html" -w '%{http_code}' https://mvesign.com/ || true)
            result=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code} %{redirect_url}' https://mvesign.com/article/sonarqube-serialization-pattern || true)
            if [ "$code" = "200" ] && grep -q '<title>' "$RUNNER_TEMP/home.html" && [ "$result" = "$expected" ]; then
              echo "Rooktest geslaagd bij poging $attempt"
              exit 0
            fi
            echo "Poging $attempt: de home geeft '$code', de redirect van /article/ geeft '$result'"
            if [ "$attempt" -lt 12 ]; then sleep 10; fi
          done
          echo "::error::Na 12 pogingen geeft de home '$code' (of heeft geen <title>), en de redirect van /article/ '$result'"
          exit 1
