# Bouwt en test de site bij elke push en pull request. Op main bewaart de build dist/ voor de
# uitrol (job deploy). Zie docs/superpowers/specs/2026-11-21-website-design.md, Bouwen en uitrollen.
name: Site

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Alleen tonen wat er zou veranderen op mijn.host (lftp mirror --dry-run)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Types en inhoud controleren
        run: npm run check

      - run: npm run build

      - run: npm test

      - name: dist/ bewaren voor de uitrol
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          include-hidden-files: true # .htaccess en _astro/.htaccess
          if-no-files-found: error
          retention-days: 7
